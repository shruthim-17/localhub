services:
  - type: web
    name: karyamitra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: USE_IN_MEMORY
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: karyamitra
      - key: OTP_API_URL
        sync: false
      - key: OTP_API_KEY
        sync: false
